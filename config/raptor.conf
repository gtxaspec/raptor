# Raptor Streaming System configuration
# See raptor-docs/23-rss-config.md for full option reference

[system]
# Video producer used by RVD. The V4L2 backend is currently a zero-copy T41
# main-stream path: NV12 capture -> DMA-BUF -> OpenIMP H.264.
video_backend = imp          # imp / v4l2
video_device = /dev/video0

[sensor]
# All values auto-detected from /proc/jz/sensor if omitted
# name = gc4653
# i2c_addr = 0x29
# i2c_adapter = 0
# fps = 0
# GPIO pins (default -1 = disabled):
# rst_gpio = -1               # sensor reset GPIO
# pwdn_gpio = -1              # sensor power down GPIO
# power_gpio = -1             # sensor power GPIO
# T40/T41 only:
# boot = 0                    # sensor boot mode (0=linear, 1=WDR, 2=60fps crop)
# mclk = 1                    # clock source (0=MCLK0, 1=MCLK1, 2=MCLK2)
# video_interface = 0         # video interface type (MIPI/DVP)
# antiflicker = 2             # 0=off, 1=50Hz, 2=60Hz (match your power grid frequency)
# low_latency = false         # encoder immediate output for all streams (saves ~100ms)

# -- Multi-sensor (dual/triple camera) --
# To enable, replace [sensor] above with [sensor0] and add [sensor1].
# Requires: dual-sensor ISP firmware, fsync-capable sensor drivers (s0/s1 variants),
# and ISP module loaded with direct_mode=X + mipi_switch_gpio set.
# See raptor-docs/multi-sensor.md for full setup guide.
#
# [sensor0]
# name = sc2336p
# i2c_addr = 0x30
# i2c_adapter = 0
# sensor_id = 0
# width = 1920                # required: procfs doesn't report with s0/s1 drivers
# height = 1080
# dual_mode = allcached       # T40: allcached / singlecached / direct / select / bypass
# dual_select = 0             # T40 select mode: sensor the ISP outputs
#
# [sensor1]
# name = sc2336ps1
# i2c_addr = 0x32
# i2c_adapter = 0
# sensor_id = 1
#
# [mipi_switch]
# enabled = false             # T23 only: set true if custom GPIO needed
# switch_gpio = 7             # GPIO controlling MIPI switch chip
# main_gstate = 0             # GPIO state to select main sensor
# sec_gstate = 1              # GPIO state to select secondary sensor
# switch_gpio2 = 0            # second MIPI switch GPIO (if needed)

[stream0]
# width = 1920                # defaults to sensor resolution if omitted
# height = 1080
# fps = 25
# codec = h264
# profile = 2
# bitrate = 3000000
# max_bitrate = 0             # 0 = auto (4/3 of target for capped modes)
# rc_mode = cbr               # cbr/vbr/capped_vbr/capped_quality/fixqp/smart
# gop = 30
# init_qp = -1                # initial QP (-1 = SDK default; required for fixqp, range 0-51)
# min_qp = -1                 # -1 = built-in default (15 cbr, 20 vbr/capped)
# max_qp = -1                 # -1 = built-in default (51 cbr, 45 vbr/capped)
# ip_delta = -1               # QP delta I vs P frames (-1 = SDK default, T31+)
# pb_delta = -1               # QP delta P vs B frames (-1 = SDK default, T31+)
# max_psnr = 0                # PSNR quality cap for capped modes (0 = SDK default, T31+)
# nr_vbs = 2
# ivdc = true                 # ISP-VPU Direct Connect, reduces rmem (T23/T41; on T32/T33
#                             # the ISP module's direct_mode decides; a mismatch here warns)
# osd_enabled = true          # per-stream OSD (default true)
# jpeg = true                 # per-stream JPEG snapshot (default true)
# jpeg_quality = 75           # override [jpeg] quality
# jpeg_fps = 1                # override [jpeg] fps

[stream1]
# enabled = true
# width = 640
# height = 360
# fps = 25
# codec = h264
# profile = 2
# bitrate = 1000000
# max_bitrate = 0             # 0 = auto (4/3 of target for capped modes)
# rc_mode = cbr               # cbr/vbr/capped_vbr/capped_quality/fixqp/smart
# gop = 30
# init_qp = -1                # initial QP (-1 = SDK default; required for fixqp, range 0-51)
# min_qp = -1                 # -1 = built-in default (15 cbr, 20 vbr/capped)
# max_qp = -1                 # -1 = built-in default (51 cbr, 45 vbr/capped)
# ip_delta = -1               # QP delta I vs P frames (-1 = SDK default, T31+)
# pb_delta = -1               # QP delta P vs B frames (-1 = SDK default, T31+)
# max_psnr = 0                # PSNR quality cap for capped modes (0 = SDK default, T31+)
# nr_vbs = 2
# osd_enabled = true          # per-stream OSD (default true)
# jpeg = true                 # per-stream JPEG snapshot (default true)
# jpeg_quality = 75           # override [jpeg] quality
# jpeg_fps = 1                # override [jpeg] fps

# -- Sensor 1 streams (multi-sensor only) --
# [sensor1_stream0]
# width = 1920
# height = 1080
# fps = 25
# codec = h264
# profile = 2
# bitrate = 2500000
# rc_mode = vbr
# gop = 50
# min_qp = 20
# max_qp = 42
# nr_vbs = 2
# ivdc = true                 # IVDC for dual-sensor (requires ISP direct_mode=2)
# osd_enabled = true          # per-stream OSD (default true)
#
# [sensor1_stream1]
# enabled = true
# width = 640
# height = 360
# fps = 25
# codec = h264
# profile = 2
# bitrate = 1000000
# rc_mode = vbr
# gop = 50
# min_qp = 22
# max_qp = 38
# nr_vbs = 2
# osd_enabled = true          # per-stream OSD (default true)

[image]
# brightness = 128             # 0-255
# contrast = 128               # 0-255
# saturation = 128             # 0-255
# sharpness = 128              # 0-255
# hue = 128                    # 0-255
# sinter = 128                 # spatial noise reduction (0-255, T20-T31 only)
# temper = 128                 # temporal noise reduction (0-255, T20-T31 only)
# ae_comp = 128                # AE compensation (0-255)
# max_again = 160              # max analog gain (0-160, higher = more noise in low light)
# max_dgain = 80               # max digital gain (0-160)
# dpc_strength = 128           # dead pixel correction (0-255, T23/T31 only)
# drc_strength = 128           # dynamic range compression (0-255, T21/T23/T31 only)
# defog_strength = 128         # defog / dehaze (0-255, T23/T31 only)
# highlight_depress = 0        # highlight depression (0-255, T20-T31 only)
# backlight_comp = 0           # backlight compensation (0-10, T23/T31 only)
# hflip = 0                    # horizontal flip (0 or 1)
# vflip = 0                    # vertical flip (0 or 1)

# -- Sensor 1 image (multi-sensor only) --
# [sensor1_image]
# brightness = 128
# contrast = 128
# saturation = 128
# sharpness = 128
# hue = 128
# sinter = 128
# temper = 128
# ae_comp = 128
# max_again = 160
# max_dgain = 80
# hflip = 0
# vflip = 0

[jpeg]
# enabled = true
# quality = 75
# fps = 1
# bufshare = false              # incompatible with rmem refmode (T31/T40/T41)
# idle = true                   # stop JPEG encoder when no viewers (saves CPU/VPU)
# Per-stream: set jpeg = false, jpeg_quality, jpeg_fps in [streamN] sections

[ring]
# refmode = false              # zero-copy: encoder writes to shared memory, ring is metadata-only
# Slot counts must be a power of two, 2..64. A value that is not one is
# rounded down, with a warning naming the key.
# main_slots = 32
# main_data_mb = 0            # 0 = auto-size from bitrate (recommended)
# sub_slots = 32
# sub_data_mb = 0             # 0 = auto-size from bitrate

[audio]
# enabled = true
# input = amic                # amic (analog mic) or dmic (digital mic array)
# sample_rate = 16000
# codec = l16                 # pcmu, pcma, l16, aac, opus
# opus_complexity = 0         # 0-10 (lower = less CPU, default 5)
# bitrate = 128000            # for aac/opus (bits per second)
# aac_profile = lc            # lc (default), he (HE-AAC v1, needs sample_rate >= 32000),
#                             # or auto (faac picks by rate/bitrate)
# volume = 80
# gain = 25
# device = 1                  # audio input device number
# DMIC options (input = dmic only, T30/T31/T32/T33/T40/T41):
# dmic_count = 1              # number of digital mics (1/2/4)
# dmic_aec_id = 0             # which mic for AEC processing (0-3)
# Audio output (speaker / backchannel)
# ao_enabled = false
# ao_volume = 80
# ao_gain = 25
# Audio effects (requires libaudioProcess.so)
# aec_enabled = false         # acoustic echo cancellation (requires ao_enabled)
# aec_profile_path = /etc     # directory containing webrtc_profile.ini
# ns_enabled = true           # noise suppression
# ns_level = 1               # 0=low, 1=moderate, 2=high, 3=veryhigh
# hpf_enabled = true          # high-pass filter (removes DC offset / low rumble)
# agc_enabled = true          # automatic gain control
# agc_target_dbfs = 10        # target level (0-31 dBfs)
# agc_compression_db = 0      # compression gain (0-90 dB)

[rtsp]
# enabled = true
# port = 554
# max_clients = 4
# Custom endpoint aliases. Setting an alias replaces the default /streamN
# path for that stream (security through obscurity) - only the alias is
# accepted. Streams left blank keep their /streamN default. Aliases must
# match [A-Za-z0-9_.-]+ and cannot shadow default/reserved names; invalid
# entries are logged and silently ignored at startup.
# endpoint_main = ch0                # sensor 0 main  (replaces: /stream0)
# endpoint_sub = ch1                 # sensor 0 sub   (replaces: /stream1)
# endpoint_s1_main = ch2             # sensor 1 main  (replaces: /stream2)
# endpoint_s1_sub = ch3              # sensor 1 sub   (replaces: /stream3)
# endpoint_s2_main = ch4             # sensor 2 main  (replaces: /stream4)
# endpoint_s2_sub = ch5              # sensor 2 sub   (replaces: /stream5)
# jpeg = false                       # expose JPEG rings as MJPEG RTSP streams
# endpoint_jpeg = mjpeg              # JPEG main      (default: /jpeg)
# endpoint_jpeg_sub = mjpeg_sub      # JPEG sub       (default: /jpeg_sub)
# username = admin
# password = secret
# tls = false                 # enable RTSPS (default port changes to 322)
# tls_cert = /etc/ssl/certs/uhttpd.crt
# tls_key = /etc/ssl/private/uhttpd.key
# tls_cipher_preference = default   # default | chacha20
#   default  - mbedtls built-in cipher order (GCM-first in TLS 1.3).
#              Best on servers with HW AES+GHASH (x86 AES-NI, ARMv8-crypto).
#   chacha20 - force TLS 1.3 to ChaCha20-Poly1305 only; TLS 1.2 falls back
#              to the CBC/CCM/GCM order. Best on slow MIPS SoCs where every
#              AES-GCM TLS record costs an ioctl to the /dev/aes engine;
#              scalar userspace ChaCha20 beats HW AES on Ingenic T-series.
# session_name = Raptor Live  # SDP session name (s=)
# session_info =              # SDP session description (i=)
# session_timeout = 60        # RTSP session timeout in seconds (min 10)
# tcp_sndbuf = 65536          # requested TCP send-buffer bytes; Linux doubles/caps it
#                             # (lower bounds stale data; blocking writes split large IDRs)
# backchannel = false         # two-way audio (ONVIF Profile T). Offers PCMU,
#                             # PCMA, opus, AAC and L16; the client picks by
#                             # sending. TCP interleaved or UDP transport.
# backchannel_codecs =        # restrict the offer, e.g. pcmu,opus (empty =
#                             # everything the build carries). PCMU is the
#                             # ONVIF baseline; excluding it is honored but
#                             # warned. Applies to new sessions immediately
#                             # (raptorctl rsd set-backchannel-codecs ...)
# rtcp_sr = true              # RTCP Sender Reports every 5s (NVRs use them for A/V sync)
# idr_on_join = true          # force a keyframe when a viewer joins (fast join; small
#                             # burst to other viewers. false = join waits up to one GOP)
sei_timecode = false          # per-frame MISB ST 0604 UTC timecode SEI (~36 B/frame,
                              # survives NVR-side copy recording; RSD only; code default: true)

[http]
# enabled = true
# port = 8080
# max_clients = 4
# username = admin
# password = secret
# https = false               # HTTPS for snapshots/MJPEG (requires cert + key)
# cert = /etc/ssl/certs/uhttpd.crt
# key = /etc/ssl/private/uhttpd.key
exif_timestamp = false        # EXIF capture time (UTC, µs) in snapshots + MJPEG frames
sign_snapshots = false        # Ed25519-sign /snap.jpg (verify: rverify; key: [recording] sign_key)

[osd]
# enabled = true
# Use ISP OSD instead of IPU OSD (T23/T32/T40/T41 only).
# ISP OSD works with IVDC and has zero DDR bandwidth overhead.
# IPU OSD is the default and works on all platforms.
# isp_osd = false
# font = /usr/share/fonts/default.ttf
# font_size = 24                # global default font size
# font_color = 0xFFFFFFFF       # global default text color (BGRA)
# font_stroke = 1               # global default stroke width (0-5)
# stroke_color = 0xFF000000     # global default stroke color (BGRA)
# time_format = %Y-%m-%d %H:%M:%S
# privacy_color = 0xFF000000

# -- OSD elements --
# Each [osd.<name>] section defines an OSD element.
# Elements can also be added/removed at runtime via raptorctl.
#
# Common keys:
#   type       = text | image | overlay
#   position   = top_left | top_center | top_right | bottom_left |
#                bottom_center | bottom_right | center | x,y
#   visible    = true | false
#   sub_only   = true | false          (render on sub-stream only)
#
# Text element keys:
#   template   = string with %var% expansion (%time%, %uptime%, %hostname%)
#   align      = left | center | right
#   max_chars  = 20                    (SHM width sizing, max 128)
#   update     = tick | change         (tick = every second, change = on template change)
#   font_size  = 0                     (0 = use global)
#   color      = 0xFFFFFFFF            (0 = use global, BGRA)
#   stroke_color = 0xFF000000          (0 = use global, BGRA)
#   stroke_size = -1                   (-1 = use global)
#
# Image element keys:
#   path       = /path/to/file.bgra
#   width      = pixels
#   height     = pixels

[osd.timestamp]
type = text
# visible = true
template = %time%
position = top_left
align = left
max_chars = 22

[osd.uptime]
type = text
# visible = true
template = %uptime%
position = top_right
align = right
max_chars = 18

[osd.camera]
type = text
# visible = true
template = Camera
position = top_center
align = center
max_chars = 14
update = change

[osd.logo]
type = image
# visible = true
path = /usr/share/images/thingino_100x30.bgra
width = 100
height = 30
position = bottom_right

[ircut]
# enabled = true
# mode = auto                 # auto, day, or night
# trigger = luma              # luma (default), gain (legacy), adc (photoresistor), or photo
# night_luma = 20             # ae_luma below this -> night (0-255)
                              # Gen3 SoCs (T32/T33/T40/T41) derive luma from the
                              # linear AE histogram and read lower than Gen1/2's
                              # GetAeLuma for the same scene (bright ~50 vs ~100+);
                              # tune per model, not across generations.
# night_gain = 80000          # total_gain above this -> night (regardless of luma)
# day_gain_pct = 25           # night->day: gain below this % of night baseline
# probe_gain_pct = 90         # night: gain dip below this % of the night
                              # baseline lifts the IR LEDs for an ambient
                              # luma probe (day detection for sensors whose
                              # gain floors under IR, e.g. T20; 0 = off)
# probe_holdoff_sec = 60      # minimum seconds between failed probes
# probe_recheck_sec = 0       # optionally probe after this long in night with
                              # no dip: strong close-range IR can hide room
                              # light from every AE metric; this cuts IR and
                              # visibly disturbs live video, so default is off
# adc_channel = 0             # ADC channel for photoresistor (trigger=adc)
# adc_night = 200             # ADC below this -> night (trigger=adc)
# adc_day = 600               # ADC above this -> day (trigger=adc)
# photo_ev_night = 50000      # EV above this -> dark (trigger=photo, high ev=dark)
# photo_ev_deep = 150000      # EV above this -> very dark (trigger=photo)
# photo_ev_day = 5000         # EV below this -> bright (trigger=photo)
# photo_rgain_rec = 0         # R-gain AWB baseline (0=auto-calibrate from sensor)
# photo_bgain_rec = 0         # B-gain AWB baseline (0=auto-calibrate from sensor)
# night_threshold = 40000     # total_gain above this -> night (trigger=gain only)
# day_threshold = 25000       # total_gain below this -> day (trigger=gain only)
# hysteresis_sec = 5          # consecutive seconds before switching
# poll_interval_ms = 1000
# night_fps = 0               # night sensor rate (0 = off): frame period
                              # bounds integration time, so a lower rate
                              # lets AE trade gain (noise) for photons;
                              # day restores the boot rate. With
                              # trigger=gain, calibrate day_threshold
                              # with this enabled
# gpio_ircut = -1             # -1 = auto from /etc/thingino.json
# gpio_ircut2 = -1
# gpio_irled = -1             # ir850 pin, -1 = auto from /etc/thingino.json
# gpio_irled2 = -1            # ir940 pin, -1 = auto from /etc/thingino.json
# pwm_irled = -1              # ir850 PWM channel on pwmchip0, for a bank wired
                              # to a PWM output instead of a pin; -1 = auto
                              # from /etc/thingino.json (a gpio.ir850 object
                              # with a pwm_channel and no pin). Set together
                              # with gpio_irled, the channel is driven
# pwm_irled2 = -1             # ir940 PWM channel, same rules
# pwm_irled_level = 100       # ir850 duty when lit, % of the period (1-100);
                              # unset = pwm_level from /etc/thingino.json,
                              # else 100
# pwm_irled2_level = 100      # ir940 duty when lit, same rules
# pwm_period_ns = 50000       # PWM period of both banks, ns (20 kHz: a night
                              # exposure spans hundreds of periods, so the
                              # picture does not band; above hearing)
# ir_levels =                 # PWM ir850 bank only: IR brightness steps in % of
                              # the period, ascending (e.g. 10,20,40,70,100).
                              # Every night starts on the first and steps up
                              # while the IR-lit gain stays above ir_step_gain,
                              # never down within a night. Empty = the one
                              # level, pwm_irled_level, which is also what a
                              # manual "ir850 on" always lights at
# ir_step_gain = 16000        # IR-lit gain above this -> next IR level
# ir850 = true                # enable 850nm IR LED (visible glow, stronger)
# ir940 = false               # enable 940nm IR LED (invisible, weaker);
                              # auto-enabled when 940 is the board's ONLY
                              # bank and this key is not set
# pulse_ms = 100              # dual-GPIO ircut coil pulse width, ms (1-1000)

[recording]
# enabled = false
# mode = continuous           # continuous, motion, or both
# stream = 0
# streams =                   # several rings at once, "ring[:tag]" comma list (max 3):
#                             # main, s1_main:R records front + rear camera; files
#                             # pair as 16-59-00.mp4 + 16-59-00_R.mp4 (unset = stream)
# audio = true
# segment_minutes = 5
# hour_dirs = true            # segments in <storage_path>/YYYY-MM-DD/HH/ (false:
#                             # all of a day in YYYY-MM-DD/)
# segment_seconds = 0          # nonzero overrides segment_minutes (debug/testing)
# storage_path =              # unset: <largest card partition>/raptor, e.g.
#                             # /mnt/mmcblk0p1/raptor; set it to pin a path.
#                             # Auto-created when on mounted media (SD/NFS/SMB);
#                             # never auto-created on the root fs
# max_storage_mb = 0
# min_free_mb = 0             # loop recording: delete the oldest segments to keep
#                             # this much free on the card (0 = off; a full card
#                             # then stops recording)
# prebuffer_sec = 5           # seconds of pre-event footage in motion clips (0-5)
# prebuffer_max_mb = 10       # per-stream pre-buffer ceiling (1-64); sized from the
#                             # stream's own rate, ~7 MB at 8 Mbit/s and 5 s pre-roll
# clip_length_sec = 60        # motion clip max duration before rotation
# clip_max_mb = 100           # max total clip storage
sei_timecode = false          # embed MISB ST 0604 UTC timecode SEI in every frame
                              # (code default: true)
sign = false                  # Ed25519 hash-chain provenance signing (verify: rverify;
                              # code default: true)
# sign_key = /etc/raptor/sign_ed25519.key  # key seed; generated on first use,
#                             # public key exported to <sign_key>.pub
# sync_interval_ms = 0        # fdatasync open recordings this often (0 = only at
#                             # close): a power cut loses at most this much
# write_buffer_kb = 1024      # file I/O runs on a writer thread; this much data
#                             # may wait behind a slow card before frames are lost
#                             # (256-16384)
# gps = true                  # embed rtd telematics (GPS, g-sensor) as dashcam
#                             # GPS records, readable by ExifTool -ee and GPX tools

[timelapse]
# enabled = false
# interval = 10               # seconds between frames (min 2)
# playback_fps = 30           # timestamp rate written to the file (1-120)
# file_frames = 0             # 0 = one file per day; N = rotate every N frames (min 60)
# max_mb = 2048               # quota for <storage_path>/timelapse; 0 = unlimited
                              # files are all-keyframe MP4s from the recording
                              # stream, SEI-timecoded and signature-chained like
                              # every recording; playback compresses real time by
                              # interval x playback_fps (10s x 30 = 300x)

[telematics]
# GPS receiver and g-sensor (rtd). The hardware comes from /etc/thingino.json:
#   "gps": {"uart": "/dev/ttyS1", "baud": 9600}
#   "gsensor": {"model": "da221", "i2c": 2, "addr": 39}
# rtd exits when neither is present. Each second it publishes a record that
# rmr embeds in recordings, and sets OSD template variables:
#   %speed% %unit% (Km/h, mph) %lat% (N:34.051) %lon% (W:118.235) %alt%
#   %heading% %sats% %gps% (GPS / NO FIX / NO GPS) %gx% %gy% %gz% %g%
#   %event% (SOS)
# The stock dashcam overlay, one line at bottom_left with
# [osd] time_format = %Y/%m/%d %H:%M:%S:
#   template = %time%   %lat%  %lon%  %speed%%unit%   (max_chars = 52)
# enabled = true
# gps_device =                # overrides thingino.json gps.uart
# gps_replay =                # replay an NMEA log (1 epoch/s, loops) instead of
#                             # the receiver: testing without a fix
# speed_unit = kmh            # kmh or mph (live: raptorctl rtd set-speed-unit)
# osd = true                  # feed the OSD variables
# set_clock = true            # set the system clock and RTC from GPS when they are
#                             # more than 2 s off (4+ satellites; never from gps_replay)
# accel_hz = 50               # g-sensor sample rate
# impact_g = 1.5              # deviation from rest that counts as an impact (0 = off)
# impact_clip = true          # an impact starts an rmr event clip ([recording]
#                             # mode = both or motion) and shows %event%
# impact_clip_sec = 30        # held this long after the last impact

[cameras]
# External cameras (rcd), each published as an extra sensor: a camera in
# slot N fills the rings sN_main / sN_sub, so RTSP, WebRTC and rmr use it
# like an on-board sensor (stream s1 / s2). Frames carry per-frame UTC via
# the ring's clock mapping, like rvd's. rcd owns the camera link below.
# enabled = false
# iface = eth0                # link to the cameras; empty = leave networking alone
# local_ip = 192.168.0.3      # our address there (EthCam modules expect .3)
# netmask = 255.255.255.0
# dhcp = true                 # DHCP server on iface: static lease per camera mac
# dhcp_start = 192.168.0.12
# dhcp_end = 192.168.0.20
# power_gpio = -1             # camera supply switch (USB529Pro 860 rear connector: 116)
# power_cycle = true          # power-cycle the cameras when rcd starts

[camera1]
# One section per camera, camera1..camera4.
# enabled = false
# type = ethcam               # ethcam: Novatek EthCam rear module
# ip = 192.168.0.12           # stock EthCam firmware is fixed at .12; patched
#                             # modules take this address by DHCP from mac
# mac =                       # 00:eb:fc:ec:50:32 (EthCam: from the chip ID)
# slot = 1                    # sensor slot: 1 or 2
# codec = h265                # h265 or h264 (EthCam: the rate is fixed in its firmware)
# enc_buf_sec = 0             # EthCam encoder buffer, seconds (0 = module default 3;
#                             # a 2592x1944 module needs 2)
# keyframe_requests = true    # pass consumers' keyframe requests to the camera; off
#                             # for a 2592x1944 EthCam (a forced I frame there drops
#                             # ~11 frames; it sends one every second anyway)
# sub = true                  # also the 640x360 display stream (sN_sub)
# main_data_mb = 3            # ring sizes
# sub_data_mb = 1

[camera2]
# A second camera, same keys as [camera1] (e.g. the other EthCam rear unit;
# record it with streams = main, s1_main:R, s2_main:R2). With two cameras,
# set each one's mac so they keep their addresses and slots across boots.
# enabled = false
# type = ethcam
# ip = 192.168.0.13
# mac =                       # this camera's mac (see above)
# slot = 2
# codec = h265
# enc_buf_sec = 0
# keyframe_requests = true
# sub = true
# main_data_mb = 3
# sub_data_mb = 1

[webrtc]
# enabled = true
# udp_port = 8443
# http_port = 8554
# max_clients = 2
# cert = /etc/ssl/certs/uhttpd.crt
# key = /etc/ssl/private/uhttpd.key
# https = true                # HTTPS for signaling (enables Talk button in browser)
# local_ip =                  # auto-detected if omitted
# audio_mode = opus           # opus (default, always transcode), auto (passthrough when possible), pcmu (force 8kHz G.711)
# opus_complexity = 2          # 0-10, transcode encoder complexity (lower = less CPU)
# opus_bitrate = 64000         # transcode encoder bitrate (bps)
# username = admin              # HTTP Basic auth (both required to enable)
# password = secret

[webcam]
# enabled = false
# device = /dev/video0        # UVC gadget device
# jpeg_stream = jpeg0         # ring for MJPEG mode (1080p)
# h264_stream = main          # ring for H.264 mode (1080p)
# jpeg_sub_stream = jpeg1     # ring for MJPEG mode (360p)
# h264_sub_stream = sub       # ring for H.264 mode (360p)
# buffers = 4                 # V4L2 buffer count
# audio = true                # enable USB microphone
# audio_stream = audio        # audio ring (requires codec = l16 in [audio])

[webtorrent]
# enabled = false
# tracker = wss://tracker.openwebtorrent.com
# stun_server = stun.l.google.com
# stun_port = 19302
# tls_verify = true           # verify tracker TLS cert (needs ca-certificates.crt; connection is refused when the bundle is missing)
# viewer_url = https://viewer.thingino.com/share.html
#                             # offers must carry offer.auth = hex HMAC-SHA256(share key, "offer\n" offer_id "\n" sdp);
#                             # the viewer must support this or its offers are dropped
# share_key =                 # fixed share key (min 8 chars, auto-generated if omitted)

[motion]
# enabled = false
# algorithm = move            # move, base_move, persondet, yolo
# sensitivity = 3             # move: 0-4, persondet: 0-5
# grid = 4x4                  # move only: auto-generate ROI grid (default 4x4 = 16 zones)
# cooldown_sec = 10
# poll_interval_ms = 500
# skip_frames = 5             # process every Nth frame in IVS
# record = true               # start recording on motion
# record_post_sec = 30        # continue recording after motion stops
# gpio_pin = -1               # GPIO to assert on motion
# Explicit ROI override (disables grid):
# roi_count = 2
# roi0 = 0,0,319,179
# roi1 = 320,180,639,359
#
# persondet options:
# det_distance = 2            # 0=6m 1=8m 2=10m 3=11m 4=13m
# motion_trigger = false      # require motion before running DL
#
# yolo options:
# model = /usr/share/models/magik_model_yolov5.bin
# num_classes = 4             # must match the model
# conf_threshold = 40         # percent (0-100)
# nms_threshold = 50          # percent (0-100)

[push]
# Stream push to an external receiver.
# RTMP/RTMPS pushes to streaming services (YouTube, Twitch, etc.);
# udp:// sends RTP directly to a host:port with no session or
# handshake -- for relays and custom receivers on the local network.
# UDP push is video only and never queues: a send the socket refuses
# is dropped, so the receiver always gets the freshest frame.
# enabled = false
# url = rtmps://a.rtmps.youtube.com/live2/your-stream-key
# url = rtmp://live.twitch.tv/app/live_your-key
# url = udp://192.168.1.50:5600
# url = udp://[fd00::50]:5600
# stream = 0                   # 0=main, 1=sub
# audio = true                 # include audio (RTMP only; transcoded to AAC if needed)
# autostart = true             # start pushing on daemon launch
# reconnect_ms = 5000          # reconnect delay on failure (1000-60000)
# tcp_sndbuf = 262144           # TCP send buffer bytes (default 256KB, absorbs WiFi stalls)

[srt]
# SRT listener daemon — serves MPEG-TS over SRT protocol
# enabled = false                # SRT listener (opt-in)
# port = 9000                   # SRT listener port
# latency = 120                 # SRT latency in ms (TsbPd buffer)
# passphrase =                  # AES encryption passphrase (10-79 chars, empty = none)
# pbkeylen = 16                 # AES key length: 16, 24, or 32
# max_clients = 4               # max simultaneous SRT clients
# stream = 0                    # default video stream (0=main, 1=sub)
# audio = true                  # include audio in TS stream

[filesource]
# File source daemon (replaces RVD+RAD on platforms without ISP hardware)
# enabled = false
# video_file = /mnt/mmcblk0p1/test.h264
# audio_file = /mnt/mmcblk0p1/test.pcm
# codec = auto                  # auto, h264, h265
# fps = 25
# loop = true
# audio_codec = l16             # l16, pcmu (g711u), pcma (g711a)
# audio_sample_rate = 16000
# video_ring_name = main
# video_slots = 32
# video_data_mb = 2
# audio_ring_name = audio
# audio_slots = 32
# audio_data_mb = 1

